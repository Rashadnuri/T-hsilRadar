name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # A real PostgreSQL for the database suites (migrations, row level security, functions).
    # Without TEST_DATABASE_URL those suites would be skipped, so CI provides it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Throw-away value for the build; no Supabase or AI secrets are needed (or wanted) in CI.
      NEXT_PUBLIC_SITE_URL: https://ci.example.test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Messages (az / ru / en have identical keys)
        run: npm run i18n:check

      - name: Types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (unit + database)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high
